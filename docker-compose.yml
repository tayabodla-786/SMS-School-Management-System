services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Tayyab2439
      POSTGRES_DB: school_db
    ports:
      - "5434:5432"  # use 5434 on host — local PostgreSQL already uses 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./Backend
    restart: always
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: Tayyab2439
      DB_NAME: school_db
      JWT_SECRET: c1ecb846a0312e3a0c4e4fa40dd0b3afd6fc195ccd7dc073db064e0c3c6f1879
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
